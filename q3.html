
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bg-dark text-white p-3">
    <div class="container"><h1>ShopEase</h1><p class="mb-0">Find products you love.</p></div>
  </header>

  <main class="container py-5">
    <h2 class="text-center mb-4">Featured Products</h2>
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" class="card-img-top" alt="Headphones">
          <div class="card-body"><h3 class="h5">Headphones</h3><p>₹1,499</p><button class="btn btn-primary">Add to Cart</button></div>
        </article>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" class="card-img-top" alt="Watch">
          <div class="card-body"><h3 class="h5">Smart Watch</h3><p>₹2,499</p><button class="btn btn-primary">Add to Cart</button></div>
        </article>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100">
          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" class="card-img-top" alt="Shoes">
          <div class="card-body"><h3 class="h5">Sports Shoes</h3><p>₹1,999</p><button class="btn btn-primary">Add to Cart</button></div>
        </article>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100">
          <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500" class="card-img-top" alt="Camera">
          <div class="card-body"><h3 class="h5">Camera</h3><p>₹5,999</p><button class="btn btn-primary">Add to Cart</button></div>
        </article>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center p-3">© 2026 ShopEase</footer>
</body>
</html>
