
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <header class="bg-primary text-white py-4">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <h1 class="h2 mb-0">My Task Tracker</h1>
      <span class="badge bg-danger fs-6">3 Pending</span>
    </div>
  </header>

  <main class="container py-5">
    <section class="card shadow-sm">
      <div class="card-header"><h2 class="h5 mb-0">Today's Tasks</h2></div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Complete assignment <span class="badge bg-danger rounded-pill">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Review Bootstrap notes <span class="badge bg-warning text-dark rounded-pill">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Organise study desk <span class="badge bg-success rounded-pill">Low</span>
        </li>
      </ul>
      <div class="card-body">
        <button type="button" class="btn btn-success">
          Completed <span class="badge text-bg-light">2</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="text-center p-3 bg-dark text-white">Stay organised. Stay productive.</footer>
</body>
</html>
