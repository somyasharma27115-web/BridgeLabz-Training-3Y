
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spice Garden Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="restaurant-header text-center text-white p-5">
    <h1>Spice Garden</h1>
    <p class="lead">Fresh flavours, unforgettable moments.</p>
  </header>

  <main class="container py-5">
    <section>
      <h2 class="text-center mb-4">Today's Menu</h2>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark"><tr><th>Dish</th><th>Category</th><th>Price</th></tr></thead>
          <tbody>
            <tr><td>Paneer Tikka</td><td>Starter</td><td>₹220</td></tr>
            <tr><td>Veg Biryani</td><td>Main Course</td><td>₹250</td></tr>
            <tr><td>Dal Makhani</td><td>Main Course</td><td>₹200</td></tr>
            <tr><td>Gulab Jamun</td><td>Dessert</td><td>₹90</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="row g-4 mt-3">
      <div class="col-md-6">
        <h2>Chef's Specials</h2>
        <ul class="list-group">
          <li class="list-group-item">Shahi Paneer</li>
          <li class="list-group-item">Tandoori Platter</li>
          <li class="list-group-item">Chocolate Brownie</li>
        </ul>
      </div>
      <div class="col-md-6">
        <figure>
          <img src="https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=800" class="img-fluid rounded" alt="Indian meal">
          <figcaption class="text-center mt-2">Delicious food, freshly prepared every day.</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center p-3">Visit us today | Spice Garden</footer>
</body>
</html>
