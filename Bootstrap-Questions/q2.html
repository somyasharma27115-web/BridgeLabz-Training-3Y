
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">
  <header class="container text-center mt-4">
    <h1 class="fw-bold">Bhawana Raj</h1>
    <p class="lead">Web Development | Cloud Computing | DevOps</p>
  </header>

  <main class="container my-4">
    <section class="profile-box p-5 text-center rounded">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300"
           class="img-fluid rounded-circle profile-img mb-3" alt="Profile">
      <h2 class="fw-bold">Hello, I'm Bhawana</h2>
      <p>I enjoy building responsive websites and learning modern technologies.</p>
      <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-primary">Download CV</a>
    </section>

    <section id="contact" class="container mt-4 mb-3">
      <h2 class="text-center">Contact Me</h2>
      <form class="mx-auto contact-form">
        <label class="form-label" for="name">Your Name</label>
        <input id="name" class="form-control mb-3" type="text" placeholder="Enter your name">
        <label class="form-label" for="email">Email</label>
        <input id="email" class="form-control mb-3" type="email" placeholder="Enter your email">
        <label class="form-label" for="message">Message</label>
        <textarea id="message" class="form-control mb-3" rows="3" placeholder="Write a message"></textarea>
        <button class="btn btn-dark" type="button">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="text-center bg-dark text-white p-3">© 2026 Bhawana Raj</footer>
</body>
</html>
